openapi: 3.0.3
info:
  title: Streamlined Properties - Organizations API
  description: |
    Organization management endpoints for creating organizations, listing user's organizations,
    viewing organization details, updating settings, and switching active organization context.
  version: 1.0.0
  contact:
    name: Streamlined Properties Development Team

servers:
  - url: https://api.streamlinedproperties.com/v1
    description: Production API
  - url: https://api-staging.streamlinedproperties.com/v1
    description: Staging API
  - url: http://localhost:3000/v1
    description: Local development

paths:
  /organizations:
    get:
      summary: List user's organizations
      description: |
        Get all organizations where the authenticated user is a member.
        Returns organizations with user's role and membership details.
      operationId: listOrganizations
      tags:
        - Organizations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationWithMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create new organization
      description: |
        Create a new organization. The authenticated user becomes the owner automatically.
        Organization name must be globally unique (case-insensitive).
      operationId: createOrganization
      tags:
        - Organizations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                  pattern: '^[a-zA-Z0-9 -]+$'
                  example: Acme Property Management
                description:
                  type: string
                  maxLength: 500
                  nullable: true
                  example: Full-service property management for residential and commercial properties
      responses:
        '201':
          description: Organization created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    $ref: '#/components/schemas/OrganizationWithMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Organization name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ORGANIZATION_NAME_EXISTS
                  message: An organization with this name already exists

  /organizations/{organizationId}:
    get:
      summary: Get organization details
      description: Get detailed information about a specific organization. User must be a member.
      operationId: getOrganization
      tags:
        - Organizations
      security:
        - BearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
          example: org_xyz789abc
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    $ref: '#/components/schemas/OrganizationWithMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update organization settings
      description: |
        Update organization name, description, or logo. Requires Owner or Admin role.
        Organization name must remain globally unique (case-insensitive).
      operationId: updateOrganization
      tags:
        - Organizations
      security:
        - BearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
          example: org_xyz789abc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                  pattern: '^[a-zA-Z0-9 -]+$'
                  example: Acme Property Management LLC
                description:
                  type: string
                  maxLength: 500
                  nullable: true
                  example: Updated description
                logoUrl:
                  type: string
                  format: uri
                  nullable: true
                  example: https://storage.example.com/logos/org_xyz789abc.png
      responses:
        '200':
          description: Organization updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Organization name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete organization
      description: |
        Permanently delete organization. Only Owner can delete. All members will be removed.
        This action is irreversible. Consider archiving instead.
      operationId: deleteOrganization
      tags:
        - Organizations
      security:
        - BearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
          example: org_xyz789abc
      responses:
        '204':
          description: Organization deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only owner can delete organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: FORBIDDEN
                  message: Only the organization owner can delete the organization
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me/active-organization:
    patch:
      summary: Switch active organization
      description: |
        Update user's active organization context. User must be a member of the organization.
        This affects role-based permissions and data filtering in subsequent API calls.
      operationId: switchActiveOrganization
      tags:
        - Organizations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - organizationId
              properties:
                organizationId:
                  type: string
                  example: org_xyz789abc
      responses:
        '200':
          description: Active organization updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeOrganizationId:
                    type: string
                    example: org_xyz789abc
                  updatedAt:
                    type: string
                    format: date-time
                    example: '2025-11-29T16:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: User is not a member of this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: NOT_MEMBER
                  message: You are not a member of this organization
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      summary: Get active organization
      description: Get user's currently active organization context
      operationId: getActiveOrganization
      tags:
        - Organizations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active organization details
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    $ref: '#/components/schemas/OrganizationWithMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User has no active organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: NO_ACTIVE_ORGANIZATION
                  message: User has not set an active organization

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from authentication endpoints

  schemas:
    Organization:
      type: object
      properties:
        id:
          type: string
          example: org_xyz789abc
        name:
          type: string
          example: Acme Property Management
        description:
          type: string
          nullable: true
          example: Full-service property management for residential and commercial properties
        logoUrl:
          type: string
          format: uri
          nullable: true
          example: https://storage.example.com/logos/org_xyz789abc.png
        ownerId:
          type: string
          example: usr_abc123xyz
        lastActiveAt:
          type: string
          format: date-time
          example: '2025-11-29T15:45:00Z'
        createdAt:
          type: string
          format: date-time
          example: '2025-11-15T09:30:00Z'
        status:
          type: string
          enum: [active, archived]
          example: active
        memberCount:
          type: integer
          example: 12

    OrganizationWithMembership:
      allOf:
        - $ref: '#/components/schemas/Organization'
        - type: object
          properties:
            membership:
              $ref: '#/components/schemas/OrganizationMember'

    OrganizationMember:
      type: object
      properties:
        id:
          type: string
          example: mem_def456ghi
        userId:
          type: string
          example: usr_abc123xyz
        organizationId:
          type: string
          example: org_xyz789abc
        role:
          type: string
          enum: [owner, admin, manager, agent, viewer]
          example: owner
        status:
          type: string
          enum: [active, removed]
          example: active
        joinedAt:
          type: string
          format: date-time
          example: '2025-11-15T09:30:00Z'
        invitedBy:
          type: string
          nullable: true
          example: null

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Invalid request parameters
            details:
              type: object
              additionalProperties: true
              nullable: true

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid request parameters

    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication token is missing or invalid

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Organization not found

security:
  - BearerAuth: []
